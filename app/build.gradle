apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    buildFeatures {
        buildConfig = true
    }
    compileSdk 35
    namespace 'com.tvtime.app'

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    def hasReleaseKey = keystoreProps.containsKey("RELEASE_STORE_FILE")

    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile file(keystoreProps["RELEASE_STORE_FILE"])
                storePassword keystoreProps["RELEASE_STORE_PASSWORD"]
                keyAlias keystoreProps["RELEASE_KEY_ALIAS"]
                keyPassword keystoreProps["RELEASE_KEY_PASSWORD"]
            }
        }
    }

    defaultConfig {
        applicationId "com.tvtime.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        def parseBotKey = keystoreProps.getProperty("PARSE_BOT_KEY", "")
        buildConfigField "String", "PARSE_BOT_KEY", "\"${parseBotKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
